<div class="code-block">
  <div class="code-toolbar"><span>{% include components/icon.html name="terminal" %} {{ include.label | default: 'Terminal' }}</span><button class="copy-button" data-copy aria-label="Copy {{ include.label | default: 'code' | escape }}">{% include components/icon.html name="copy" %}<span aria-live="polite">Copy</span></button></div>
  <pre tabindex="0"><code>{{ include.code | escape }}</code></pre>
</div>
