<script id="seed-theme-config" type="application/json">[{% for theme in site.data.themes %}{"id":{{ theme.id | jsonify }},"name":{{ theme.name | jsonify }},"background":{{ theme.colors.bg | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]</script>
<script>
  (() => {
    const themes = JSON.parse(document.getElementById('seed-theme-config').textContent);
    let saved;
    try { saved = localStorage.getItem('seed-color-theme'); } catch (_) { /* Storage is optional. */ }
    const theme = themes.find(item => item.id === saved) || themes[0];
    document.documentElement.dataset.theme = theme.id;
    document.querySelector('meta[name="theme-color"]').content = theme.background;
  })();
</script>
