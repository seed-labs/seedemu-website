quickstart:
  eyebrow: "Your first experiment"
  title: "From a few commands to a small Internet."
  description: "Start with the simple autonomous system example in the SEED Emulator repository."
  prerequisites: "Install Git, Python 3, Docker, and Docker Compose. Run these commands in a Bash-compatible shell."
  instructions:
    - "Clone the project and load its development environment."
    - "Generate the simple AS example, then build and start its containers."
    - "Explore more examples and visualization setup in the official guide."
  code: |
    git clone https://github.com/seed-labs/seed-emulator.git
    cd seed-emulator
    source development.env
    cd examples/A00-simple-as
    python3 ./simple-as.py
    cd output
    docker-compose build
    docker-compose up
  source_label: "Official getting started guide"
  source_url: "https://github.com/seed-labs/seed-emulator#getting-started"
  resources_label: "Explore SEED labs"
  resources_url: "https://seedsecuritylabs.org/emulator/"
